name: FreeView
id: io.github.oubigfa.freeview
version: 0.1.3
copyright: © 2026 FreeView contributors

icon:
  png: ../../assets/branding/FreeView_logo.png

dev:
  target: native

build:
  output: ../../dist
  targets: [windows_x64]
  # gen2brain/heic and gen2brain/jpegxl would otherwise try to load
  # libheif.dll and libjxl.dll from the DLL search path as they start.
  tags: [nodynamic]

windows:
  publisher: FreeView

file_types:
  - name: Image
    extensions: [jpg, jpeg, jpe, jfif, png, gif, webp, bmp, dib, tif, tiff, avif, dds, hdp, heic, heif, hif, ico, jxl, jxr, wdp, svg, svgz, livp, dng, cr2, cr3, crw, nef, nrw, arw, srf, sr2, orf, rw2, raf, pef, srw, x3f, 3fr, erf, kdc, mrw, mos, iiq, rwl, psd, psb, qoi, hdr, exr, tga, icb, vda, vst]
    role: viewer
  - name: Comic archive
    extensions: [zip, cbz, rar, cbr, 7z, cb7, tar, cbt]
    role: viewer

release:
  github: OUBIGFA/FreeView
