name: FreeView
id: io.github.oubigfa.freeview
version: 0.2.0
copyright: © 2026 FreeView contributors

icon:
  png: ../../assets/branding/FreeView_logo.png

dev:
  target: native

build:
  output: ../../dist
  targets: [windows_x64]

windows:
  publisher: FreeView

file_types:
  - name: Image
    extensions: [jpg, jpeg, jpe, jfif, png, gif, webp, bmp, dib, tif, tiff]
    role: viewer
  - name: Comic archive
    extensions: [zip, cbz, rar, cbr, 7z, cb7, tar, cbt]
    role: viewer
